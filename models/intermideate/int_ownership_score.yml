version: 2

models:
  - name: int_ownership_score
    description: City-level property ownership score.

    columns:
      - name: city
        description: City name.
        data_tests:
          - not_null
          - unique

      - name: ownership_score
        description: Household-weighted property ownership score.

      - name: total_households
        description: Households participating in scoring.

      - name: weighted_score_sum
        description: Total household-weighted score.

      - name: total_zipcode_count
        description: Total mapped postcodes.

      - name: scored_zipcode_count
        description: Postcodes participating in scoring.

      - name: mapped_households
        description: Total mapped households.

      - name: unavailable_ownership_data_zipcode_count
        description: Postcodes without valid ownership data.

      - name: zipcode_score_coverage
        description: Proportion of mapped postcodes scored.

      - name: household_score_coverage
        description: Proportion of mapped households scored.